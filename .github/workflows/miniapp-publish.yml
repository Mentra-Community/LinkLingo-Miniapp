name: Publish the miniapp

# Builds the miniapp and publishes it to Mentra's static miniapp hosts: miniapps.mentraglass.com,
# miniapps.staging.mentraglass.com and miniapps.dev.mentraglass.com. Every Mentra App with LinkLingo
# updates it from <host>/com.mentra.link/miniapp.json. Each host's credentials are in the GitHub
# environment named after it, which only main may deploy to. A version a host already has is skipped,
# so publishing happens when miniapp.json's version is bumped.
#
# The bundle calls the backend main deploys (porter.dev.yaml), and the deploy workflow calls this once
# that backend is deployed. .github/scripts/publish-miniapp-r2.ts is a copy of MentraOS's, where its
# tests live.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the miniapp
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Pack
        run: |
          backend=$(sed -n 's/^  MENTRA_PUBLIC_LINKLINGO_BACKEND_URL: *//p' porter.dev.yaml)
          if [[ -z "$backend" ]]; then echo "::error::porter.dev.yaml sets no MENTRA_PUBLIC_LINKLINGO_BACKEND_URL"; exit 1; fi
          echo "${GITHUB_SHA::7}" > build-id.txt
          NODE_ENV=production MENTRA_PUBLIC_LINKLINGO_BACKEND_URL="$backend" bun run pack
      - uses: actions/upload-artifact@v4
        with:
          name: miniapp-${{ github.sha }}
          path: miniapp/build/*.zip
          if-no-files-found: error
          retention-days: 7

  hosts:
    name: Choose this branch's hosts
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      hosts: ${{ steps.choose.outputs.hosts }}
    steps:
      - id: choose
        env:
          BRANCH: ${{ github.ref_name }}
          HOSTS: >-
            [
            {"name": "prod", "branch": "main", "bucket": "mentra-miniapps-prod", "url": "https://miniapps.mentraglass.com/", "environment": "miniapp-store-production"},
            {"name": "staging", "branch": "main", "bucket": "mentra-miniapps-staging", "url": "https://miniapps.staging.mentraglass.com/", "environment": "miniapp-store-staging"},
            {"name": "dev", "branch": "main", "bucket": "mentra-miniapps-dev", "url": "https://miniapps.dev.mentraglass.com/", "environment": "miniapp-store-dev"}
            ]
        run: |
          hosts=$(jq -c --arg branch "$BRANCH" 'map(select(.branch == $branch))' <<<"$HOSTS")
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          if [[ "$hosts" == "[]" ]]; then echo "$BRANCH publishes to no host."; fi

  publish:
    name: Publish to ${{ matrix.host.name }}
    needs: [build, hosts]
    if: ${{ needs.hosts.outputs.hosts != '[]' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: ${{ matrix.host.environment }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: miniapp-${{ github.sha }}
          path: miniapp/build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Publish
        env:
          MINIAPPS_R2_ENDPOINT: ${{ secrets.MINIAPPS_R2_ENDPOINT }}
          MINIAPPS_R2_ACCESS_KEY_ID: ${{ secrets.MINIAPPS_R2_ACCESS_KEY_ID }}
          MINIAPPS_R2_SECRET_ACCESS_KEY: ${{ secrets.MINIAPPS_R2_SECRET_ACCESS_KEY }}
          MINIAPPS_R2_BUCKET: ${{ matrix.host.bucket }}
          MINIAPPS_PUBLIC_URL: ${{ matrix.host.url }}
        run: |
          zips=(miniapp/build/*.zip)
          if [[ ${#zips[@]} -ne 1 ]]; then echo "::error::Expected one ZIP, found ${#zips[@]}"; exit 1; fi
          bun .github/scripts/publish-miniapp-r2.ts "${zips[0]}"
