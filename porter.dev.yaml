# Porter v2 — DEV. Secrets from Doppler project `linklingo` / config `dev`.
#
#   porter apply -f ./porter.dev.yaml

version: v2
name: linklingo-miniapp-dev

build:
  method: docker
  context: .
  dockerfile: ./docker/Dockerfile

services:
  - name: backend
    type: web
    run: bun backend/src/index.ts
    port: 80
    instances: 1
    cpuCores: 0.5
    ramMegabytes: 512
    livenessCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 3
      initialDelaySeconds: 10
    readinessCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 3
      initialDelaySeconds: 10
    env:
      NODE_ENV: production
      PORT: "80"
      PACKAGE_NAME: com.mentra.link
