# Porter v2 — DEV. Secrets from Doppler project `linklingo` / config `dev`.
#
#   porter apply -f ./porter.dev.yaml

version: v2

# Application configuration is synced directly from Doppler.
envGroups:
  - linklingo-dev-doppler
name: linklingo-miniapp-dev

build:
  method: docker
  context: .
  dockerfile: ./docker/Dockerfile

# App-level env doubles as build args for the ARGs declared in the Dockerfile.
# The miniapp bundle inlines this origin at build time, so it must name the
# environment serving it. Verify with GET /healthz → miniapp.backendUrl.
services:
  - name: backend
    type: web
    run: bun backend/src/index.ts
    port: 80
    instances: 1
    cpuCores: 0.5
    ramMegabytes: 512
    livenessCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 3
      initialDelaySeconds: 10
    readinessCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 3
      initialDelaySeconds: 10
    connections:
      - type: awsRole
        role: porter-s3-7a9d09e4
