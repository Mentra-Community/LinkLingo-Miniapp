# Porter v2 — DEV. Secrets from Doppler project `linklingo` / config `dev`.
#
#   porter apply -f ./porter.dev.yaml

version: v2
name: linklingo-miniapp-dev

envGroups:
  - linklingo-dev

build:
  method: docker
  context: .
  dockerfile: ./docker/Dockerfile

# App-level env doubles as build args for the ARGs declared in the Dockerfile.
# The miniapp bundle inlines this origin at build time, so it must name the
# environment serving it. Verify with GET /healthz → miniapp.backendUrl.
env:
  MENTRA_PUBLIC_LINKLINGO_BACKEND_URL: https://linklingo-miniapp-dev.mentraglass.com

services:
  - name: backend
    type: web
    run: bun backend/src/index.ts
    port: 80
    instances: 1
    cpuCores: 0.5
    ramMegabytes: 512
    livenessCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 3
      initialDelaySeconds: 10
    readinessCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 3
      initialDelaySeconds: 10
    env:
      NODE_ENV: production
      PORT: "80"
      PACKAGE_NAME: com.mentra.link
      MENTRA_AUTH_JWKS_URL: https://core.mentraglass.com/.well-known/jwks.json
      GEMINI_MODEL: gemini-3.5-flash-lite
