# Porter v2 — DEV. Secrets from Doppler project `linklingo` / config `dev`.
#
#   porter apply -f ./porter.dev.yaml

version: v2
name: linklingo-miniapp-dev

envGroups:
  - linklingo-dev
  - linklingo-openrouter-dev

build:
  method: docker
  context: .
  dockerfile: ./docker/Dockerfile

# App-level env doubles as build args for the ARGs declared in the Dockerfile.
# The miniapp bundle inlines this origin at build time, so it must name the
# environment serving it. Verify with GET /healthz → miniapp.backendUrl.
env:
  MENTRA_PUBLIC_LINKLINGO_BACKEND_URL: https://linklingo-miniapp-dev.mentraglass.com

services:
  - name: backend
    type: web
    run: bun backend/src/index.ts
    port: 80
    instances: 1
    cpuCores: 0.5
    ramMegabytes: 512
    livenessCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 3
      initialDelaySeconds: 10
    readinessCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 3
      initialDelaySeconds: 10
    env:
      NODE_ENV: production
      PORT: "80"
      PACKAGE_NAME: com.mentra.link
      MENTRA_AUTH_JWKS_URL: https://core.mentraglass.com/.well-known/jwks.json
      # Live gloss path. Benchmarked against the corpus (backend/scripts/
      # bench-gloss-models.ts): 328ms p50 / 430ms p95 / 92% recall, versus
      # 755ms / 976ms / 86% on google/gemini-3.5-flash-lite. The provider pin is
      # load-bearing — unpinned, OpenRouter routes by price and p95 hits 1206ms.
      OPENROUTER_MODEL: openai/gpt-oss-120b
      OPENROUTER_PROVIDER: cerebras
      # WebView "ask" box. Separate from the live gloss pin: Cerebras does not
      # serve Opus, and this call is allowed to take seconds.
      OPENROUTER_ANALYST_MODEL: anthropic/claude-opus-5.5
      OPENROUTER_ANALYST_PROVIDER: anthropic
      AWS_REGION: us-west-2
      # 24h tape. Survives the Karpenter eviction that wipes pod memory.
      LINKLINGO_TAPE_BUCKET: porter-15081-linklingo-tape-fa86de16
    connections:
      - type: awsRole
        role: porter-s3-7a9d09e4
