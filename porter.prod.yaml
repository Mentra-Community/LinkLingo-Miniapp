# Porter v2 — PROD. Secrets from Doppler project `linklingo` / config `prod`.
#
#   porter apply -f ./porter.prod.yaml

version: v2
name: linklingo-miniapp-prod

build:
  method: docker
  context: .
  dockerfile: ./docker/Dockerfile

# App-level env doubles as build args for the ARGs declared in the Dockerfile.
# The miniapp bundle inlines this origin at build time and cannot rediscover it
# on the phone, so it must be this app's own public domain. Verify after a
# deploy with GET /healthz → miniapp.backendUrl.
env:
  MENTRA_PUBLIC_LINKLINGO_BACKEND_URL: https://linklingo-miniapp-prod.mentraglass.com

services:
  - name: backend
    type: web
    run: bun backend/src/index.ts
    port: 80
    instances: 1
    cpuCores: 0.5
    ramMegabytes: 512
    livenessCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 3
      initialDelaySeconds: 10
    readinessCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 3
      initialDelaySeconds: 10
    env:
      NODE_ENV: production
      PORT: "80"
      PACKAGE_NAME: com.mentra.link
